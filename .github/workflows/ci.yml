name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install
        run: uv sync --all-extras --frozen

      - name: Verify (fmt + lint + typecheck + fast tests)
        run: make verify

      - name: Scenario invariants (no LLM, fixtures only)
        run: make transcripts-ci
