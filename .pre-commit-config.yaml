# Local-first verification. CLAUDE.md forbids --no-verify.
# Stage hooks run on commit; pre-push runs the full gate.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.ambr$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (locked ruff)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: ruff
        name: ruff check (locked ruff)
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]

      - id: pyright
        name: pyright (changed files)
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        require_serial: true
        pass_filenames: false

      - id: no-todo-in-code
        name: no TODO/FIXME in code (use docs/FOLLOWUPS.md)
        entry: bash -c 'if grep -RInE --exclude-dir=__pycache__ "TODO|FIXME|XXX|HACK" src/ tests/ scripts/ 2>/dev/null; then echo "Promote these to docs/FOLLOWUPS.md or fix them now."; exit 1; fi'
        language: system
        pass_filenames: false

      - id: docs-links
        name: relative markdown links must resolve
        entry: python3 scripts/check_links.py
        language: system
        types: [markdown]
        pass_filenames: false

      - id: no-secrets
        name: scan staged files for token-shaped secrets
        entry: python3 scripts/check_secrets.py
        language: system
        pass_filenames: true
        exclude: ^(\.env\.example|uv\.lock)$

      - id: no-stray-root-md
        name: no net-new top-level .md outside whitelist (use docs/ or docs/scratch/)
        entry: bash -c 'allowed="^(CLAUDE\.md|README\.md)$"; new=$(git diff --cached --name-only --diff-filter=AR | grep -E "^[^/]+\.md$" | grep -vE "$allowed" || true); if [ -n "$new" ]; then echo "Net-new top-level .md files are not allowed:"; echo "$new"; echo "Move under docs/ (durable) or docs/scratch/ (gitignored). See CLAUDE.md."; exit 1; fi'
        language: system
        pass_filenames: false

      - id: fast-tests
        name: fast tests (unit + contract, no scenarios)
        entry: uv run pytest -m "not scenario and not slow" -q
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: full-verify
        name: full verify (fmt-check + lint + typecheck + tests)
        entry: make verify
        language: system
        pass_filenames: false
        stages: [pre-push]
